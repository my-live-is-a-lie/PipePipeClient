pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    plugins {
        id 'com.android.application' version '9.2.1' apply false
        id 'com.android.library' version '9.2.1' apply false

        id 'org.jetbrains.kotlin.android' version '2.3.21' apply false
        id 'org.jetbrains.kotlin.kapt' version '2.3.21' apply false
        id 'org.jetbrains.kotlin.plugin.parcelize' version '2.3.21' apply false

        id 'org.jetbrains.kotlin.plugin.compose' version '2.3.21' apply false

    }

}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
        maven { url "https://clojars.org/repo" }
    }
}

rootProject.name = "PipePipe"

include ':app'
include ':ffmpeg'

// PipePipeExtractor has no published/versioned releases on JitPack, so the dependency
// declared in app/build.gradle (an unversioned JitPack coordinate) cannot resolve on its
// own. This project instead builds the extractor from source.
//
// By default this expects PipePipeExtractor checked out as a true sibling folder next to
// this repo (for local development):
//   parent-folder/
//     PipePipeClient/   <- this repo
//     PipePipeExtractor/
// git clone https://github.com/InfinityLoop1308/PipePipeExtractor.git ../PipePipeExtractor
//
// GitHub Actions' checkout action cannot check out to a true sibling folder outside the
// workspace, so the CI workflow (.github/workflows/build-debug-apk.yml) checks it out into
// a subfolder of this same workspace instead, and passes its location via the
// PIPEPIPE_EXTRACTOR_PATH environment variable.
def extractorPath = System.getenv('PIPEPIPE_EXTRACTOR_PATH') ?: '../PipePipeExtractor'
includeBuild(extractorPath)
