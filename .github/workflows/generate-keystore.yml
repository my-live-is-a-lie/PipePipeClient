name: Generate signing keystore (one-time setup)

# Run this ONCE to create your personal signing keystore. After downloading the
# artifact and adding the secrets described in the job summary, you can delete
# this workflow file - it is not needed for regular builds.
on:
  workflow_dispatch:
    inputs:
      store_password:
        description: 'Keystore password (choose a strong password, write it down somewhere safe)'
        required: true
        type: string
      key_password:
        description: 'Key password (can be the same as keystore password)'
        required: true
        type: string
      key_alias:
        description: 'Key alias (a short name for the key, e.g. pipepipe)'
        required: true
        default: 'pipepipe'
        type: string

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK (for keytool)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore pipepipe-release.keystore \
            -alias "${{ inputs.key_alias }}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ inputs.store_password }}" \
            -keypass "${{ inputs.key_password }}" \
            -dname "CN=PipePipe Personal Build, OU=Personal, O=Personal, L=Unknown, S=Unknown, C=US"

      - name: Base64-encode keystore (for pasting into a GitHub secret)
        run: base64 -w 0 pipepipe-release.keystore > pipepipe-release.keystore.b64

      - name: Upload keystore artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pipepipe-signing-keystore
          path: |
            pipepipe-release.keystore
            pipepipe-release.keystore.b64
          retention-days: 1

      - name: Print setup instructions
        run: |
          echo "## Next steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Download the **pipepipe-signing-keystore** artifact from this run." >> $GITHUB_STEP_SUMMARY
          echo "2. Open **pipepipe-release.keystore.b64** (plain text) and copy its entire contents." >> $GITHUB_STEP_SUMMARY
          echo "3. In your repo: Settings -> Secrets and variables -> Actions -> New repository secret." >> $GITHUB_STEP_SUMMARY
          echo "4. Create these 4 secrets:" >> $GITHUB_STEP_SUMMARY
          echo "   - **KEYSTORE_BASE64** = the copied contents of the .b64 file" >> $GITHUB_STEP_SUMMARY
          echo "   - **KEY_STORE_PASSWORD** = the keystore password you just entered" >> $GITHUB_STEP_SUMMARY
          echo "   - **KEY_ALIAS** = ${{ inputs.key_alias }}" >> $GITHUB_STEP_SUMMARY
          echo "   - **KEY_PASSWORD** = the key password you just entered" >> $GITHUB_STEP_SUMMARY
          echo "5. Delete the artifact from this run afterwards (Actions -> this run -> trash icon) for safety." >> $GITHUB_STEP_SUMMARY
          echo "6. You can then delete this workflow file (.github/workflows/generate-keystore.yml) - it's a one-time tool." >> $GITHUB_STEP_SUMMARY
